<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
        content="Sign up for ParentSpark — the community for single parents to meet and connect." />
    <title>Register — ParentSpark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Body & Fonts */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #ffe6eb, #ffffff);
            color: #333333;
            margin: 0;
            padding: 0;
        }

        main {
            max-width: 500px;
            margin: 40px auto;
            padding: 24px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.2);
        }

        h2 {
            color: #e60039;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 10px;
            transition: border 0.3s, box-shadow 0.3s;
            width: 100%;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #ff3366;
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.3);
            outline: none;
        }

        button {
            background: linear-gradient(90deg, #ff3366, #e60039);
            color: #fff;
            font-weight: 600;
            padding: 14px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 16px;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background: linear-gradient(90deg, #ff6699, #ff3366);
            transform: translateY(-2px);
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        #register-help {
            color: #666;
            font-size: 0.9rem;
            margin-top: 12px;
            text-align: center;
        }

        #message {
            margin-top: 12px;
            text-align: center;
            font-weight: 600;
            color: #e60039;
        }

        @media (max-width: 500px) {
            main {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h2>Create your ParentSpark account</h2>

        <form id="registerForm" action="/register_user" method="post">

            <!-- Step 1: Account Info -->
            <div class="step active" id="step1">
            

                <label for="email">Email</label>
                <input type="email" name="email" placeholder="Email" required>

                <label for="password">Password</label>
                <input type="password" name="password" placeholder="Password" required>

                <div class="navigation-buttons">
                    <span></span>
                    <button type="button" onclick="nextStep()">Next →</button>
                </div>
            </div>

            <!-- Step 2: Basic Profile -->
            <div class="step" id="step2">
                <label for="age">Age</label>
                <input type="number" name="age" placeholder="Your age" min="18" required>

                <label for="location">Location</label>
                <input type="text" name="location" placeholder="City, Country" required>

                <label for="gender">Gender</label>
                <select name="gender" required>
                    <option value="">Select</option>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Non-binary</option>
                </select>

                <label for="looking_for">Looking for</label>
                <select name="looking_for" required>
                    <option value="">Select</option>
                    <option>Men</option>
                    <option>Women</option>
                    <option>Everyone</option>
                </select>

                <div class="navigation-buttons">
                    <button type="button" onclick="prevStep()">← Back</button>
                    <button type="button" onclick="nextStep()">Next →</button>
                </div>
            </div>

            <!-- Step 3: Lifestyle & Bio -->
            <div class="step" id="step3">
                <label for="kids">Kids</label>
                <select name="kids" required>
                    <option value="">Select</option>
                    <option>Yes</option>
                    <option>No</option>
                </select>

                <label for="bio">Bio</label>
                <textarea name="bio" rows="3" placeholder="Tell others about yourself..."></textarea>

                <label for="interests">Interests / Hobbies</label>
                <input type="text" name="interests" placeholder="e.g. hiking, cooking">

                <div class="navigation-buttons">
                    <button type="button" onclick="prevStep()">← Back</button>
                    <button type="submit">Register</button>
                </div>
            </div>

        </form>

        <p id="register-help">By registering you agree to ParentSpark's terms.</p>
        <p id="message" aria-live="polite"></p>

        <p style="text-align:center; margin-top:20px; font-size:0.95rem;">
            Already a member?
            <a href="login.html" style="
                display:inline-block;
                background: linear-gradient(90deg, #ff3366, #e60039);
                color: #ffffff;
                padding: 8px 16px;
                border-radius: 20px;
                text-decoration: none;
                font-weight: 600;
                transition: background 0.3s;
            " onmouseover="this.style.background='linear-gradient(90deg, #ff6699, #ff3366)'"
                onmouseout="this.style.background='linear-gradient(90deg, #ff3366, #e60039)'">
                Login here
            </a>
        </p>

    </main>

    <script>
        let currentStep = 1;
        const totalSteps = 3;

        function showStep(step) {
            for (let i = 1; i <= totalSteps; i++) {
                const el = document.getElementById(`step${i}`);
                if (i === step) el.classList.add("active");
                else el.classList.remove("active");
            }
        }

        function nextStep() {
            const form = document.getElementById('registerForm');
            const inputs = document.querySelectorAll(`#step${currentStep} input, #step${currentStep} select, #step${currentStep} textarea`);
            for (let input of inputs) {
                if (!input.checkValidity()) {
                    input.reportValidity();
                    return;
                }
            }
            if (currentStep < totalSteps) {
                currentStep++;
                showStep(currentStep);
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                showStep(currentStep);
            }
        }

        showStep(currentStep);
    </script>
</body>

</html>
