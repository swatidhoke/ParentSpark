<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParentSpark Home</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>

<body>
    <h1>Welcome to Home Page of ParentSpark</h1>
    <div>
        <a href="/login.html"><button type="button">Log In</button></a>
    </div>
    <div>
        <a href="/register.html"><button type="button">Sign Up</button></a>
    </div>

<div>
    <h2>Feedback & Suggestions</h2>
    <form id="feedbackForm" action="/feedback_submit" method="post" style="margin-top:20px;">
        <textarea id="FeedbackMessage" name="message" rows="10" cols="50" placeholder="Leave us feedback here..."></textarea>
        <br>
        <button type="submit"
            style="margin: top 10px;padding:10px 20px;border:none;border-radius:6px;background:#28a745;color:#fff;cursor:pointer;">Submit
            Feedback</button>

    <button type="button" id="generateRecommendationBtn" name="message"
        style="margin-top:10px;padding:10px 20px;border:none;border-radius:6px;background:#28a745;color:#fff;cursor:pointer;">
        Generate Recommendation from AI
    </button>

    </form>
</div>
</body>

</html>
