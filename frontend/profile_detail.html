<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Details</title>
    <style>
        body {
            font-family: Inter, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .card {
            max-width: 600px;
            background: white;
            padding: 30px;
            margin: auto;
            border-radius: 12px;
            text-align: center;
        }

        img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            color: #e60039;
        }

        .placeholder {
            color: #999;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="card">
        <img id="photo" src="" alt="Profile Photo">
        <h1 id="name">Name</h1>
        <p id="bio" class="placeholder">No bio available</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const name = params.get("name") || "Unknown";
        const age = params.get("age") || "";
        const bio = params.get("bio") || "No bio available";
        const img = params.get("img");

        document.getElementById("name").textContent =
            age ? `${name}, ${age}` : name;

        document.getElementById("bio").textContent = bio;

        if (img) {
            document.getElementById("photo").src = img;
        } else {
            document.getElementById("photo").src = "/static/avatar_placeholder.png";
        }
    </script>

</body>

</html>
